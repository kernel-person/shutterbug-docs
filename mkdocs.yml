site_name: ShutterBug
site_description: Tài liệu hướng dẫn sử dụng và quản trị plugin ShutterBug.
site_url: https://kernel-person.github.io/shutterbug-docs/
repo_url: https://github.com/kernel-person/shutterbug-docs
repo_name: kernel-person/shutterbug-docs

theme:
  name: material
  language: vi
  logo: images/hero-camera-album.png
  favicon: images/favicon.png
  palette:
    - scheme: default
      primary: brown
      accent: brown
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Trang chủ: index.md
  - Bắt đầu: getting-started.md
  - Lệnh: commands.md
  - Cài đặt máy ảnh: camera-settings.md
  - Album và Bộ sưu tập: albums-and-collections.md
  - Cấu hình quản trị: admin-configuration.md
  - Quyền: permissions.md
  - Danh sách ảnh chụp: screenshots.md